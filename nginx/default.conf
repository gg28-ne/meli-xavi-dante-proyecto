# Nginx sirve la web mínima. No hay proxy ni autenticación implementados.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
    }

    location /api/ {
        # TODO F3: sustituir este 501 por el proxy al backend:3000.
        # TODO F3: transmitir Host, X-Forwarded-For y X-Forwarded-Proto.
        # TODO F3: proteger GET /api/reserves y PUT/DELETE /api/reserves/:id.
        # POST /api/reserves y POST /api/chat deben seguir siendo públicos.
        # Pista: estudiad limit_except y la herencia de las directivas de acceso.
        # Una API de gestión accesible sin credenciales NO completa F3.
        default_type application/json;
        return 501 '{"error":"TODO F3: conectar y proteger el proxy de API"}';
    }

    location /gestion/ {
        # TODO F3: aquí autenticación HTTP básica con auth_basic y auth_basic_user_file.
        # TODO F3: crear .htpasswd, excluirlo de Git y montarlo en Compose.
        # La maqueta se puede ver ahora sin contraseña; todavía no gestiona datos.
        try_files $uri $uri/ =404;
    }

    location /phpmyadmin/ {
        # TODO F3: aquí autenticación HTTP básica y proxy a phpmyadmin:80.
        # Comprobad la barra final, PMA_ABSOLUTE_URI y los enlaces del panel.
        return 501;
    }
}
